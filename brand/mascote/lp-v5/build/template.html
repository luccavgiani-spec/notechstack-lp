<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>nó — mascote 3D v5</title>
<style>
  :root{--amber:#EDA33B;--blue:#3D63DB;--green:#30A46C;--red:#E0543C;--ink:#17181c;--bg:#FAFAF7;}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;overflow:hidden;color:var(--ink)}
  #layer-bg,#layer-canvas,#layer-fg,#layer-gradient{position:fixed;inset:0}
  #layer-bg{background-size:cover;background-position:center;z-index:0}
  #layer-gradient{z-index:0;display:none;background:radial-gradient(ellipse at 50% 35%, #EDA33B 0%, #DB9752 45%, #C9AF98 78%, #b39c85 100%)}
  #layer-canvas{z-index:1}
  #layer-canvas canvas{display:block;width:100%;height:100%}
  #layer-fg{z-index:2;background-size:cover;background-position:center;pointer-events:none;display:none}
  #fade{position:fixed;inset:0;background:#C9AF98;opacity:0;pointer-events:none;z-index:5}
  #hud{position:fixed;top:16px;left:16px;z-index:6;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border:1px solid #e4e1da;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5}
  #hud .logo{font-size:15px;font-weight:700}
  #hud .logo .pt{color:var(--amber)}
  #hud .sub{color:#7a7870;margin-top:2px}
  #ctrl{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid #e4e1da;border-radius:20px;padding:8px 14px;font-size:12px;max-width:94vw}
  button{font:inherit;border:1px solid #d8d5cd;background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
  button:hover{border-color:var(--ink)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .scenes{display:flex;gap:4px}
  .scene-btn{width:26px;height:26px;padding:0;border-radius:50%}
  .dots{display:flex;gap:7px}
  .dot{width:16px;height:16px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:transform .12s}
  .dot:hover{transform:scale(1.15)}
  .dot.on{border-color:var(--ink)}
  .dot[data-c=amber]{background:var(--amber)}
  .dot[data-c=blue]{background:var(--blue)}
  .dot[data-c=green]{background:var(--green)}
  .dot[data-c=red]{background:var(--red)}
  input[type=range]{width:80px;accent-color:var(--ink)}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:var(--bg);font-size:13px;color:#7a7870;text-align:center;padding:20px}
  #spdv{min-width:32px;display:inline-block;text-align:right}
  .sep{width:1px;height:18px;background:#e0ddd5}
</style>
</head>
<body>
<div id='loading'>carregando o mascote…</div>
<div id='layer-bg'></div>
<div id='layer-gradient'></div>
<div id='layer-canvas'></div>
<div id='layer-fg'></div>
<div id='fade'></div>
<div id='hud'>
  <div class='logo'>nó<span class='pt'>.</span> mascote 3D</div>
  <div class='sub' id='hud-sub'>cena 1/7</div>
</div>
<div id='ctrl'>
  <button id='prev' title='cena anterior'>‹</button>
  <div class='scenes'>
    <button class='scene-btn on' data-s='1'>1</button>
    <button class='scene-btn' data-s='2'>2</button>
    <button class='scene-btn' data-s='3'>3</button>
    <button class='scene-btn' data-s='4'>4</button>
    <button class='scene-btn' data-s='5'>5</button>
    <button class='scene-btn' data-s='6'>6</button>
    <button class='scene-btn' data-s='7'>7</button>
  </div>
  <button id='next' title='próxima cena'>›</button>
  <div class='sep'></div>
  <button id='play'>pausar</button>
  <span>vel <span id='spdv'>1.0x</span></span>
  <input id='spd' type='range' min='0.2' max='2' step='0.1' value='1'>
  <div class='sep'></div>
  <span style='color:#7a7870'>olhos</span>
  <div class='dots'>
    <div class='dot on' data-c='amber' title='âmbar — neutro'></div>
    <div class='dot' data-c='green' title='verde — health'></div>
    <div class='dot' data-c='blue' title='azul — dados'></div>
    <div class='dot' data-c='red' title='vermelho — alerta'></div>
  </div>
</div>

<!--ASSETS-->

<script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
<script>
if (typeof THREE === 'undefined') document.getElementById('loading').textContent = 'erro: não consegui baixar o three.js (verifique a internet e recarregue)';
</script>
<script><!--VENDOR_GLTFLOADER--></script>
<script><!--APP_SCRIPT--></script>
</body>
</html>
