project_id = "sdeowbqmwkwseyktyemn"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://notechstack.com.br"
additional_redirect_urls = ["https://*.notechstack.com.br"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

# Per-function config. oauth-callback is called by Meta via browser redirect,
# so JWT verification must be disabled.
[functions.oauth-callback]
verify_jwt = false

[functions.sync-meta-ads]
verify_jwt = true

[functions.sync-meta-organic]
verify_jwt = true

[functions.refresh-tokens]
verify_jwt = true
